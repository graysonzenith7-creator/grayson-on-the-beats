<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grayson On The Beats</title>

  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 60px;
      font-size: 32px;
    }

    p {
      color: #aaa;
      font-size: 18px;
    }

    a {
      display: inline-block;
      background: #ff5368;
      color: white;
      text-decoration: none;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 18px;
      margin-top: 20px;
    }

    #studio {
      margin-top: 100px;
      padding: 30px 20px;
    }

    .studio-box {
      max-width: 400px;
      margin: 30px auto;
    }

    .track {
      background: #121922;
      border: 1px solid #292f3e;
      padding: 20px;
      margin: 12px 0;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>🇺🇬 Grayson On The Beats</h1>

  <p>🎙️ Ugandan Music Studio</p>

  <a href="#studio">Open Studio</a>

  <section id="studio">
    <h2>🎵 Welcome To The Studio</h2>

    <p>Start creating your next hit song.</p>

    <div class="studio-box">

      <div class="track">
        🎹 Beat Maker
      </div>

      <div class="track">
        🎙️ Voice Recorder
      </div>

      <div class="track">
        🎚️ Mixer
      </div>

    </div>
  </section>

</body>
</html>
